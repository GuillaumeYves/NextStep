name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate addon
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.1

      - name: Check Lua syntax
        run: find . -type f -name '*.lua' -not -path './.git/*' -print0 | sort -z | xargs -0 -r -n1 luac5.1 -p

      - name: Validate addon manifest
        run: bash tools/validate-toc.sh NextStep.toc

      - name: Validate localization
        run: lua5.1 tools/validate-locales.lua NextStep.toc

      - name: Test category planning and profile migration
        run: lua5.1 tests/preferences.lua

      - name: Test compact recommendation navigation
        run: lua5.1 tests/recommendation-navigation.lua

      - name: Test leveling dungeon normalization
        run: lua5.1 tests/leveling-dungeons.lua

      - name: Test curated route selection
        run: lua5.1 tests/curated-routes.lua

      - name: Test curated route API wrappers
        run: lua5.1 tests/route-api.lua

      - name: Test native tooltip routing
        run: lua5.1 tests/tooltips.lua

      - name: Test patch collection catalog
        run: lua5.1 tests/patch-catalog.lua

      - name: Test combined patch completion
        run: lua5.1 tests/patch-progress.lua

      - name: Test scroll preservation and panel layout
        run: lua5.1 tests/ui-layout.lua

      - name: Test character progression analysis
        run: lua5.1 tests/progression-analysis.lua

      - name: Check text policy
        shell: bash
        run: |
          if git grep -n -e $'\u2014' -e $'\u2013' -- '*.lua' '*.md' '*.toc' '*.yml' '*.yaml' '*.sh'; then
            echo "Em dash or en dash found."
            exit 1
          fi

          if git grep -n -I -E '[[:blank:]]+$' -- '*.lua' '*.md' '*.toc' '*.yml' '*.yaml' '*.sh'; then
            echo "Trailing whitespace found."
            exit 1
          fi
